# Основной конфигурационный файл nginx
# Расположение: C:\nginx\conf\nginx.conf

# Главный контекст
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;

    access_log  logs/access.log;
    error_log   logs/error.log;
    
    # Сервер для раздачи текстур
    server {
        listen       80;
         server_name example.com;  # Раскомментируйте если используете домен
        
        # Путь к директории с текстурами (Windows путь)
        root C:\Users\install\Desktop\СТиП\СТИП_курсовая\Messanger-Family\messenger-ui\dist;
	index index.html;
        
        
        # Для скинов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
	
         # Reverse-proxy для API запросов
        location /api/ {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Проксирование WebSocket (Socket.IO)
        location /socket.io/ {
            proxy_pass http://localhost:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Для загруженных файлов (если они раздаются через Node.js, но лучше проксировать)
        location /uploads/ {
            proxy_pass http://localhost:3001;
            proxy_set_header Host $host;
        }

        # Все остальные запросы отдаём index.html (для SPA)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Обработка ошибок
        error_page 404 /index.html;
    }
}